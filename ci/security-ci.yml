# GitHub Actions workflow — SECURITY CHECKS
#
# This file cannot be committed to .github/workflows/ by the automation
# account (GitHub Apps need the extra `workflows` permission to create or
# update workflow files). Copy it into place once, manually:
#
#   cp ci/security-ci.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml && git commit -m 'ci: add security checks'
#
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Flaky-failure diagnostics. The runner's log archive is not always
      # downloadable (blob host unreachable), which turned intermittent
      # failures into a bare "Process completed with exit code 1". This wraps
      # `npm` for every later step through BASH_ENV — the individual
      # `run: npm run test:*` steps stay unchanged — so a failing step
      # republishes its own interesting lines as check annotations and its tail
      # into the job summary. Credentials are never part of these logs.
      - name: Report failing-step details as annotations
        run: |
          cat > /tmp/ci-report.sh <<'EOS'
          npm() {
            local args="$*" title log code n line safe
            log="/tmp/ci-step-$$.log"
            # Annotation titles are truncated by GitHub anyway; keep them short
            # and readable ("run test:integration") instead of dumping argv.
            title=$(printf '%s' "$args" | cut -c1-70)
            command npm "$@" 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            if [ "$code" != "0" ]; then
              {
                echo "## FAILED: npm ${args} (exit ${code})"
                echo
                echo '```'
                tail -n 80 "$log"
                echo '```'
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              n=0
              while IFS= read -r line; do
                [ "$n" -ge 25 ] && break
                safe=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-400)
                [ -n "$safe" ] || continue
                echo "::error title=npm ${title} (exit ${code})::${safe}"
                n=$((n + 1))
              done < <(grep -aE "✗|FAIL|Error|error:|npm error|npm ERR|failed|Timed out|timeout|EADDRINUSE|ECONNREFUSED|ENOSPC|Cannot find|not ok|initdb|pg_ctl|drizzle" "$log" | head -25)
            fi
            rm -f "$log"
            return "$code"
          }
          EOS
          # BASH_ENV is *sourced* by every later bash step, so the function
          # definition itself has to go into that file — appending the path
          # would make bash try to execute it ("Permission denied").
          cat /tmp/ci-report.sh >> "$BASH_ENV"

      # Two steps on purpose. Shipped dependencies have NO exceptions and must
      # stay clean; the second gate covers the dev toolchain and only ignores an
      # advisory that a reviewed entry in audit-exceptions.json documents (the
      # first gate would otherwise fail forever on GHSA-vfj7-8cjw-p6xm, which has
      # no released fix, and hide the 22 gates that come after it).
      - name: Dependency audit — production dependencies (high+, no exceptions)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit — all dependencies (high+, reviewed exceptions)
        run: npm run audit:check

      - name: Typecheck
        run: npm run typecheck

      - name: Offline schema and documentation regression tests
        run: npm run test:schema

      - name: Full-schema apply safety guard
        run: npm run test:schema-apply-safety

      - name: Security regression tests
        run: npm run test:security

      - name: Discovery matcher tests — university/scholarship Match %
        run: npm run test:match

      - name: AI settings tests
        run: npm run test:ai-settings

      - name: AI format tests
        run: npm run test:ai-format

      - name: AI cost, budget and entitlement tests
        run: npm run test:ai-cost

      - name: Ownership tests (embedded Postgres)
        run: npm run test:ownership

      - name: Portability, config and RLS tests (embedded Postgres)
        run: npm run test:portability

      - name: Telegram integration tests (embedded Postgres)
        run: npm run test:telegram-integration

      - name: API integration tests — ownership, Premium, AI quota (embedded Postgres)
        run: npm run test:integration

      - name: E2E journey tests (embedded Postgres)
        run: npm run test:journey

      - name: Chancing + probability-policy tests (embedded Postgres)
        run: npm run test:chancing

      - name: Recommender tests — engine + API (embedded Postgres)
        run: npm run test:recommend

      - name: Career discovery tests — quiz engine + honesty rules
        run: npm run test:career-discovery

      - name: Arrival plan tests — 7/30/90 days + first year
        run: npm run test:arrival

      - name: Opportunities feed tests (embedded Postgres)
        run: npm run test:opportunities

      - name: Differentiator tests — pills, waivers, outreach, timeline, apostille, twin
        run: npm run test:differentiators

      - name: i18n message parity
        run: npm run check:i18n

      - name: Lint (baseline gate — fails on new or worsened problems)
        run: npm run lint:baseline

      - name: Responsive source-level regression tests
        run: npm run test:responsive

      - name: Dark-mode contrast audit
        run: npm run test:dark

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
