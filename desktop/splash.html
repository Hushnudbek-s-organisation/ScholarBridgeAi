<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ScholarBridge</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 0%, #24406f 0%, #1b2a4a 55%, #131f36 100%);
        color: #e8eefb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .logo {
        width: 74px;
        height: 74px;
        border-radius: 20px;
        background: linear-gradient(135deg, #4f8cff, #7c5cff);
        display: grid;
        place-items: center;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        font-size: 34px;
      }
      h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: 0.2px; }
      p { margin: 0; font-size: 13px; color: #a9b8d4; text-align: center; max-width: 330px; line-height: 1.5; }
      .bar { width: 190px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #4f8cff, #9d7bff);
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      .error p { color: #ffd0d0; white-space: pre-wrap; font-size: 12.5px; }
      .error .bar { display: none; }
      .hint { font-size: 11.5px; color: #7d8caa; }
    </style>
  </head>
  <body>
    <div class="logo">🎓</div>
    <h1 id="title">Starting ScholarBridge</h1>
    <p id="detail">Preparing the app…</p>
    <div class="bar"><span></span></div>
    <p class="hint">The first launch takes a little longer — it sets up your private database.</p>
    <script>
      // Called from the main process as the boot sequence advances.
      window.setStatus = function (status) {
        document.getElementById("title").textContent = status.title || "ScholarBridge";
        document.getElementById("detail").textContent = status.detail || "";
        document.body.classList.toggle("error", /could not start/i.test(status.title || ""));
      };
    </script>
  </body>
</html>
