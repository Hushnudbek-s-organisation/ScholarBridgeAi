name: Fetch site source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Fetch pages and assets
        run: |
          mkdir -p out
          BASE="https://cullen-food-studio.crypto-sabaraliev.chatgpt.site"
          curl -sSL --compressed -D out/_headers_root.txt "$BASE/" -o out/index.html
          curl -sSL --compressed -D out/_headers_admin.txt "$BASE/admin" -o out/admin.html
          cat out/index.html out/admin.html | grep -oE '(src|href)="[^"]+"' | sed -E 's/^(src|href)="//; s/"$//' | grep -vE '^(#|mailto:|tel:|javascript:)' | sort -u > out/_assets.txt || true
          i=0
          while IFS= read -r a; do
            i=$((i+1))
            case "$a" in
              http*) url="$a" ;;
              /*) url="$BASE$a" ;;
              *) url="$BASE/$a" ;;
            esac
            fname=$(echo "$a" | tr '/:?&=' '____' | tr -cd 'A-Za-z0-9._-')
            code=$(curl -sSL --compressed -o "out/asset_${i}_${fname}" -w "%{http_code}" "$url" || echo ERR)
            echo "$code $a -> asset_${i}_${fname}" >> out/_asset_map.txt
          done < out/_assets.txt
          ls -la out
      - name: Commit fetched source
        run: |
          mkdir -p site-audit/raw && cp -r out/* site-audit/raw/
          git config user.name "arena-agent"
          git config user.email "actions@users.noreply.github.com"
          git add site-audit
          git commit -m "chore: snapshot site source for audit [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push
