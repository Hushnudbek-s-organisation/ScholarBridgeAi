name: Probe site endpoints v2

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Probe
        run: |
          mkdir -p site-audit/probe2
          cd site-audit/probe2
          BASE="https://cullen-food-studio.crypto-sabaraliev.chatgpt.site"
          ORIGIN="Origin: $BASE"
          REF="Referer: $BASE/"
          probe() {
            name="$1"; shift
            echo "===== $name =====" >> report.txt
            curl -sS -o "resp_${name}.body" -D "resp_${name}.hdr" -w "STATUS %{http_code} | size %{size_download}\n" "$@" >> report.txt 2>&1
          }
          # CSRF hypothesis: same-origin headers should pass the browser check and reach credential validation
          probe login_origin_ok   -X POST -H "Content-Type: application/json" -H "$ORIGIN" -H "$REF" -d '{"action":"login","studentNumber":"+998901234567","password":"wrong-password-123","groupId":"ielts-senior-1"}' "$BASE/api/student-auth"
          probe login_origin_bad  -X POST -H "Content-Type: application/json" -H "Origin: https://evil.example.com" -H "Referer: https://evil.example.com/x" -d '{"action":"login","studentNumber":"+998901234567","password":"wrong-password-123","groupId":"ielts-senior-1"}' "$BASE/api/student-auth"
          probe login_no_origin_ct -X POST -H "Content-Type: text/plain" -H "$ORIGIN" -d '{"action":"login"}' "$BASE/api/student-auth"
          probe login_get_method  -H "$ORIGIN" "$BASE/api/student-auth"
          probe login_options     -X OPTIONS -H "$ORIGIN" -H "Access-Control-Request-Method: POST" "$BASE/api/student-auth"
          probe refresh_origin    -X POST -H "Content-Type: application/json" -H "$ORIGIN" -d '{"action":"refresh"}' "$BASE/api/auth"
          probe logout_origin     -X POST -H "Content-Type: application/json" -H "$ORIGIN" -d '{"action":"logout"}' "$BASE/api/auth"
          probe food_fake_cookie -H "Cookie: cullen_session=fake-token-value-123456" "$BASE/food/index.html"
          probe food_with_origin -H "$ORIGIN" "$BASE/food/index.html"
          probe adminslash       "$BASE/admin/"
          probe upper_admin      "$BASE/Admin"
          probe api_platform_origin -H "$ORIGIN" "$BASE/api/platform"
          probe login_empty_user -X POST -H "Content-Type: application/json" -H "$ORIGIN" -d '{"action":"login","studentNumber":"","password":"","groupId":""}' "$BASE/api/student-auth"
          probe login_xss_user   -X POST -H "Content-Type: application/json" -H "$ORIGIN" -d '{"action":"login","studentNumber":"<script>alert(1)</script>","password":"x","groupId":"ielts-senior-1"}' "$BASE/api/student-auth"
          probe login_sqlinject  -X POST -H "Content-Type: application/json" -H "$ORIGIN" -d '{"action":"login","studentNumber":"admin\u0027 OR \u00271\u0027=\u00271","password":"x","groupId":"ielts-senior-1"}' "$BASE/api/student-auth"
          echo "===== key response bodies =====" >> report.txt
          for f in resp_*.body; do echo "--- $f ---" >> report.txt; head -c 400 "$f" >> report.txt; echo >> report.txt; done
          echo "===== key headers =====" >> report.txt
          for f in resp_login_origin_ok.hdr resp_login_origin_bad.hdr resp_food_fake_cookie.hdr resp_login_options.hdr; do echo "--- $f ---" >> report.txt; cat "$f" >> report.txt; done
          cat report.txt
      - name: Commit probe results
        run: |
          git config user.name "arena-agent"
          git config user.email "actions@users.noreply.github.com"
          git add site-audit/probe2
          git commit -m "chore: probe2 results [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push
