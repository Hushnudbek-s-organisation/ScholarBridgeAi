# Render.com blueprint for ScholarBridge AI
# Create the database first (it auto-provisions a managed PostgreSQL), then
# the web service. Set the secret env vars (marked sync:false) in the Render
# dashboard after the first deploy.

databases:
  - name: scholarbridge-db
    plan: free
    databaseName: scholarbridge
    user: scholarbridge

services:
  - type: web
    name: scholarbridge-ai
    runtime: node
    plan: free
    # IMPORTANT: db:push is intentionally NOT in the build command.
    # The Supabase database is the source of truth — the app must adapt to
    # it, NOT modify it automatically. Run db:push manually only when you
    # explicitly decide to change the database schema.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholarbridge-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # Signs the HttpOnly session cookie (sb_session). REQUIRED in
      # production: >= 32 random chars. Generate with
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: SESSION_SECRET
        sync: false
      # Encrypts AI provider keys stored from the admin panel (>= 16 chars).
      - key: AI_KEYS_ENCRYPTION_SECRET
        sync: false
      # Bootstrap password for the seeded admin account (>= 8 chars).
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Visa Speaking Assistant + AI model. Unset uses the same code default.
      # llama-3.3-70b-versatile was removed by Groq on 2026-08-16.
      # Current models: https://console.groq.com/docs/models
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Optional payment keys (only needed if you configure real Payme/Click).
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: PAYME_PASSWORD
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
