# Render.com blueprint for ScholarBridge AI
# Create the database first (it auto-provisions a managed PostgreSQL), then
# the web service. Set the secret env vars (marked sync:false) in the Render
# dashboard after the first deploy.

databases:
  - name: scholarbridge-db
    plan: free
    databaseName: scholarbridge
    user: scholarbridge

services:
  - type: web
    name: scholarbridge-ai
    runtime: node
    plan: free
    # IMPORTANT: db:push is intentionally NOT in the build command.
    # The Supabase database is the source of truth — the app must adapt to
    # it, NOT modify it automatically. Run db:push manually only when you
    # explicitly decide to change the database schema.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # DATABASE_URL — paste the connection string in the Render dashboard.
      # The repo's source of truth is SUPABASE (DEPLOYMENT.md §2,
      # supabase/full_schema.sql), so use:
      #   Project Settings → Database → Connection string → URI
      #   → "Session pooler" host (aws-0-<region>.pooler.supabase.com:5432)
      #   → append ?sslmode=require
      # NEVER the DIRECT `db.<ref>.supabase.co` host from Render: it is
      # IPv6-only and Render's egress is IPv4 — every query would time out and
      # the site would answer "Authentication is temporarily unavailable."
      # The free Render DB below is NOT wired anymore on purpose: Render frees
      # idle free-tier databases after 30 days, the mapped connectionString
      # then points at a deleted host, and the same outage returns. Keep it
      # only if you deliberately want Render-managed data (re-add the
      # fromDatabase mapping and update DEPLOYMENT.md §2).
      - key: DATABASE_URL
        sync: false
        required: true
      - key: NODE_VERSION
        value: "22"
      # Signs the HttpOnly session cookie (sb_session). REQUIRED in
      # production: >= 32 random chars. Generate with
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: SESSION_SECRET
        sync: false
      # Encrypts AI provider keys stored from the admin panel (>= 16 chars).
      - key: AI_KEYS_ENCRYPTION_SECRET
        sync: false
      # Bootstrap admin (used only while no platform owner exists; after an
      # ownership transfer the seed never re-promotes it). Set in the dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Bootstrap password for the seeded admin account (>= 8 chars).
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Visa Speaking Assistant + AI model. Unset uses the same code default.
      # llama-3.3-70b-versatile was removed by Groq on 2026-08-16.
      # Current models: https://console.groq.com/docs/models
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      # Canonical public URL (https://your-domain, no trailing slash). When
      # unset, Render's RENDER_EXTERNAL_URL is used automatically.
      - key: APP_URL
        sync: false
      # Legacy name, still honoured after APP_URL.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Google Search Console HTML-tag token (public, not a secret). The
      # HTML-file method is also served from public/google*.html.
      - key: GOOGLE_SITE_VERIFICATION
        value: "EZ2ipQrYUQxTQEBlEGYcqAOfVHm6pc0oIm1BYkN2VTs"
      # --- Supabase Storage (branding uploads: logo / favicon) ---------------
      # Without these two, Admin → Branding returns 503 "Storage is not
      # configured". Supabase dashboard → Project Settings → API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional: SSR catalogue pages when no service key is present.
      - key: SUPABASE_ANON_KEY
        sync: false
      # Optional: bucket name, defaults to LOGO.
      - key: SUPABASE_BRANDING_BUCKET
        sync: false
      # Optional payment keys (only needed if you configure real Payme/Click).
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: PAYME_PASSWORD
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
